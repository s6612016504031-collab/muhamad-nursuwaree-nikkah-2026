<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f0e6" />
    <title>Muhamad & Nursuwaree | Nikkah</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,600;1,500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
    <main>
      <section class="intro" id="intro" aria-label="เปิดซองเชิญ">
        <div class="envelope-stage" id="envelopeStage">
          <img class="envelope-base" src="assets/ซองเชิญงานแต่งลายดอกไม้ทองอ่อน.png" alt="ซองเชิญ Muhamad และ Nursuwaree" />
          <div class="envelope-piece top"></div><div class="envelope-piece bottom"></div>
          <div class="envelope-piece left"></div><div class="envelope-piece right"></div>
          <button class="open-button" id="openButton" type="button"><span>OPEN INVITATION</span><small>แตะเพื่อเปิดซอง</small></button>
        </div>
        <p class="intro-note">Muhamad &amp; Nursuwaree</p>
      </section>

      <section class="invitation" id="invitation" aria-hidden="true">
        <div class="floating-controls"><button id="musicToggle" type="button" aria-label="เปิดหรือปิดเพลง">♫</button></div>
        <article class="card hero-card reveal"><img src="assets/ยินดีต้อนรับสู่งานนิกะห์ใต้ซุ้มทอง.png" alt="Welcome to the Nikkah Ceremony" /></article>
        <div class="gold-rule"></div>
        <article class="card reveal"><img src="assets/การ์ดเชิญงานแต่งงานอิสลามหรูหรา.png" alt="รายละเอียดคู่บ่าวสาว" /></article>
        <div class="gold-rule"></div>
        <article class="card reveal"><img src="assets/S__11993094.jpg" alt="วันจัดงาน 10 มกราคม 2569" /></article>
        <div class="gold-rule"></div>
        <article class="card reveal"><img src="assets/โปสเตอร์กำหนดการงานแต่งงานสีทองหรูหรา.png" alt="กำหนดการงานแต่งงาน" /></article>
        <div class="gold-rule"></div>
        <article class="card reveal"><img src="assets/การ์ดแต่งงานบ้านปัตตานี.png" alt="สถานที่จัดงาน บ้านบานา ปัตตานี" /></article>
        <div class="gold-rule"></div>
        <article class="card map-card reveal">
          <img src="assets/S__12001282.jpg" alt="แผนที่จัดงาน" />
          <a class="map-link" href="https://maps.app.goo.gl/uPuJkWkNktvC15C39" target="_blank" rel="noopener">เปิดใน Google Maps <span>↗</span></a>
        </article>
        <div class="gold-rule"></div>
        <article class="card reveal"><img src="assets/S__11993093.jpg" alt="QR PromptPay" /></article>
        <footer>ด้วยความยินดียิ่ง · Muhamad &amp; Nursuwaree</footer>
      </section>
    </main>
    <audio id="weddingMusic" preload="auto" loop><source src="assets/3efa56e1-e323-4b84-a06d-5540a0da59a5.mp3" type="audio/mpeg" /></audio>
    <script src="script.js"></script>
  </body>
</html>
